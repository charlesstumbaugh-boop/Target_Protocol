feedback:

  # --------------------------------------------------
  # Visual Feedback
  # --------------------------------------------------
  visual:

    hit_spark:
      duration_ms: 120
      size_scale: 1.0
      colors:
        normal: "#FFFFFF"
        fast_reaction: "#4DA3FF"
        perfect: "#FFD700"

    hit_marker:
      enabled: true
      duration_ms: 150
      scale_up: 1.15
      color: "#FFFFFF"

    target_flash:
      enabled: true
      duration_ms: 80
      colors:
        normal: "#FFFFFF"
        perfect: "#FFD700"

    perfect_slowmo:
      enabled: true
      duration_ms: 100
      time_scale: 0.85

    combo_visuals:
      pulse_enabled: true
      pulse_strength: 0.2
      gold_outline_duration_ms: 1000


  # --------------------------------------------------
  # Audio Feedback
  # --------------------------------------------------
  audio:

    hit_sound:
      file: "hit_normal.wav"
      volume: 0.8
      pitch: 1.0

    perfect_hit_sound:
      file: "hit_perfect.wav"
      volume: 1.0
      pitch: 0.9

    fast_reaction_sound:
      file: "hit_fast.wav"
      volume: 0.9
      pitch: 1.2

    combo_increase_sound:
      file: "combo_up.wav"
      volume: 0.7
      pitch_ramp: true

    miss_sound:
      file: "miss_soft.wav"
      volume: 0.4
      pitch: 0.8


  # --------------------------------------------------
  # Haptic Feedback
  # --------------------------------------------------
  haptics:

    mobile:
      hit_strength: light
      perfect_strength: medium
      miss_strength: none

    vr:
      hit_strength: medium
      perfect_strength: strong
      miss_strength: none
      duration_ms: 60

    web:
      enabled: false


  # --------------------------------------------------
  # Combo Feedback
  # --------------------------------------------------
  combo:

    multiplier_start: 3
    multiplier_max: 10

    visual:
      pulse_strength: 0.25
      color_shift:
        enabled: true
        perfect_color: "#FFD700"

    audio:
      pitch_ramp_enabled: true
      ramp_amount: 0.05


  # --------------------------------------------------
  # Platform Overrides
  # --------------------------------------------------
  platform_overrides:

    mobile:
      visual:
        perfect_slowmo:
          time_scale: 0.9
      audio:
        hit_sound:
          volume: 0.7
      haptics:
        perfect_strength: strong

    vr:
      visual:
        hit_marker:
          scale_up: 1.25
      audio:
        spatial_audio: true
      haptics:
        duration_ms: 80

    web:
      visual:
        hit_marker:
          enabled: true
      audio:
        hit_sound:
          volume: 0.6
      haptics:
        enabled: false


  # --------------------------------------------------
  # Debug Settings
  # --------------------------------------------------
  debug:
    show_hit_rays: false
    log_feedback_events: false
